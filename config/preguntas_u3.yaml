# =====================================================================
#  Banco teórico (opción múltiple) — Unidad 3, Cuaderno 01
# ---------------------------------------------------------------------
#  `correcta` es el ÍNDICE de la opción buena, contando desde 0
#  (0 = la primera de la lista). El motor baraja las opciones, así que el
#  orden que ve el alumno NO es el de este archivo.
#
#  Los prefijos "a)", "b)", ... son solo para que tú leas el archivo cómodo:
#  el motor los quita antes de barajar, porque al barajar quedarían fuera de
#  orden. Escríbelos, pero no dependas de ellos.
#
#  CUIDADO con las barras de LaTeX:
#    * en bloque `>-` el texto es LITERAL:          escribe \frac
#    * entre comillas DOBLES "..." la barra escapa:  escribe \\frac
# =====================================================================

ALG_INICIO:
  - id: alg_01
    titulo: "Producto matricial vs elemento a elemento"
    pregunta: >-
      En la biblioteca del curso, **¿qué hace el operador `@`** entre dos
      matrices?
    opciones:
      - "a) El producto matricial (fila por columna)"
      - "b) El producto elemento a elemento"
      - "c) La traspuesta del producto"
      - "d) La concatenación de las dos matrices"
    correcta: 0

  - id: alg_02
    titulo: "Qué hace el asterisco"
    pregunta: >-
      Si escribes `A * B` con matrices de la biblioteca del curso, **¿qué
      obtienes**?
    opciones:
      - "a) El producto matricial"
      - "b) El producto elemento a elemento (como el `.*` de MATLAB)"
      - "c) Un error, porque `*` no está permitido"
      - "d) La matriz traspuesta"
    correcta: 1

  - id: alg_03
    titulo: "Forma de un vector"
    pregunta: >-
      En la biblioteca, **¿qué forma tiene** `M[[1, 2, 3]]`?
    opciones:
      - "a) Un renglón de forma (1, 3)"
      - "b) Una columna de forma (3, 1)"
      - "c) Una matriz cuadrada 3x3"
      - "d) Un escalar"
    correcta: 0

  - id: alg_04
    titulo: "Matriz aumentada"
    pregunta: >-
      Para el sistema $\mathbf{A}\mathbf{x} = \mathbf{b}$, **¿cómo se forma la
      matriz aumentada** $[\mathbf{A} \mid \mathbf{b}]$?
    opciones:
      - 'a) Apilando $\mathbf{b}$ a la derecha de $\mathbf{A}$: `M[[A, b]]`'
      - 'b) Apilando $\mathbf{b}$ debajo de $\mathbf{A}$: `M[[A], [b]]`'
      - 'c) Sumando $\mathbf{A} + \mathbf{b}$'
      - 'd) Multiplicando $\mathbf{A} @ \mathbf{b}$'
    correcta: 0

  - id: alg_05
    titulo: "Por qué falla np.array con matrices"
    pregunta: >-
      **¿Por qué no sirve** `np.array([A, b])` para concatenar matrices?
    opciones:
      - "a) Porque crea un arreglo de más dimensiones (o de objetos) en vez de una matriz"
      - "b) Porque `np.array` solo acepta números enteros"
      - "c) Porque borra las matrices originales"
      - "d) Porque devuelve siempre la matriz identidad"
    correcta: 0

  - id: alg_06
    titulo: "Traspuesta"
    pregunta: >-
      **¿Para qué sirve** `A.T`?
    opciones:
      - "a) Para multiplicar elemento a elemento"
      - "b) Para intercambiar renglones por columnas (y comprobar simetría)"
      - "c) Para calcular el determinante"
      - "d) Para concatenar dos matrices"
    correcta: 1

  - id: alg_07
    titulo: "Construir una matriz de ceros"
    pregunta: >-
      Con la biblioteca del curso, **¿qué devuelve** `zeros(3)`?
    opciones:
      - "a) Un vector de 3 ceros"
      - "b) Una matriz 3x3 de ceros"
      - "c) Un escalar cero"
      - "d) Una matriz identidad 3x3"
    correcta: 1

  - id: alg_08
    titulo: "Trampa de los enteros"
    pregunta: >-
      Si una matriz se crea con **enteros** (`np.array` sin punto decimal) y se
      hace una operación de renglón con un factor fraccionario, **¿qué pasa**?
    opciones:
      - "a) Python lanza un error de tipo"
      - "b) Los decimales se truncan sin avisar y el resultado sale mal"
      - "c) La matriz se convierte automáticamente a flotante"
      - "d) Nada especial, el resultado es exacto"
    correcta: 1
